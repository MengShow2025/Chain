<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanChain 安全控制台演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-active { background-color: #00ff88; }
        .status-warning { background-color: #ffaa00; }
        .status-error { background-color: #ff4444; }
        .status-inactive { background-color: #666666; }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .metric-value {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            transition: width 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 3px;
        }

        .log-info { background: rgba(0, 212, 255, 0.1); }
        .log-success { background: rgba(0, 255, 136, 0.1); }
        .log-warning { background: rgba(255, 170, 0, 0.1); }
        .log-error { background: rgba(255, 68, 68, 0.1); }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .timestamp {
            opacity: 0.6;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ TitanChain 安全控制台</h1>
            <p>实时监控区块链安全状态和性能指标</p>
        </div>

        <div class="controls">
            <button class="btn" onclick="refreshAll()">🔄 刷新所有数据</button>
            <button class="btn" onclick="testAllApis()">🧪 测试所有API</button>
            <button class="btn" onclick="clearLogs()">🗑️ 清空日志</button>
        </div>

        <div class="dashboard">
            <!-- 系统概览 -->
            <div class="card">
                <h3>📋 系统概览</h3>
                <div id="system-overview">
                    <div class="metric">
                        <span>系统状态</span>
                        <span class="metric-value" id="system-status">
                            <span class="status-indicator status-warning"></span> 加载中...
                        </span>
                    </div>
                    <div class="metric">
                        <span>安全评分</span>
                        <span class="metric-value" id="security-score">--/100</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="security-progress" style="width: 0%"></div>
                    </div>
                    <div class="metric">
                        <span>威胁等级</span>
                        <span class="metric-value" id="threat-level">--</span>
                    </div>
                    <div class="metric">
                        <span>活跃安全层</span>
                        <span class="metric-value" id="active-layers">--/--</span>
                    </div>
                </div>
            </div>

            <!-- 安全层状态 -->
            <div class="card">
                <h3>🔒 安全层状态</h3>
                <div id="security-layers">
                    <div class="metric">
                        <span>ZK证明层</span>
                        <span class="metric-value">
                            <span class="status-indicator status-warning"></span> 加载中...
                        </span>
                    </div>
                    <div class="metric">
                        <span>TEE系统</span>
                        <span class="metric-value">
                            <span class="status-indicator status-warning"></span> 加载中...
                        </span>
                    </div>
                    <div class="metric">
                        <span>MPC协议</span>
                        <span class="metric-value">
                            <span class="status-indicator status-warning"></span> 加载中...
                        </span>
                    </div>
                    <div class="metric">
                        <span>量子抗性</span>
                        <span class="metric-value">
                            <span class="status-indicator status-warning"></span> 加载中...
                        </span>
                    </div>
                </div>
            </div>

            <!-- 活跃威胁 -->
            <div class="card">
                <h3>⚠️ 活跃威胁</h3>
                <div id="active-threats">
                    <div class="metric">
                        <span>威胁数量</span>
                        <span class="metric-value" id="threat-count">--</span>
                    </div>
                    <div id="threat-list">
                        <div class="metric">
                            <span>加载中...</span>
                            <span class="loading"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 性能指标 -->
            <div class="card">
                <h3>📊 性能指标</h3>
                <div id="performance-metrics">
                    <div class="metric">
                        <span>CPU使用率</span>
                        <span class="metric-value" id="cpu-usage">--%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="cpu-progress" style="width: 0%"></div>
                    </div>
                    <div class="metric">
                        <span>内存使用率</span>
                        <span class="metric-value" id="memory-usage">--%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="memory-progress" style="width: 0%"></div>
                    </div>
                    <div class="metric">
                        <span>区块链TPS</span>
                        <span class="metric-value" id="blockchain-tps">--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日志区域 -->
        <div class="card">
            <h3>📝 系统日志</h3>
            <div class="log-container" id="log-container">
                <div class="log-entry log-info">
                    <span class="timestamp">[启动]</span> 安全控制台演示页面已加载
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api/security';
        let refreshInterval;

        // 日志函数
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('log-container');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // 限制日志条数
            const logs = logContainer.children;
            if (logs.length > 50) {
                logContainer.removeChild(logs[0]);
            }
        }

        // 获取状态指示器HTML
        function getStatusIndicator(status) {
            const statusMap = {
                'ACTIVE': 'status-active',
                'WARNING': 'status-warning',
                'ERROR': 'status-error',
                'INACTIVE': 'status-inactive'
            };
            const className = statusMap[status] || 'status-warning';
            return `<span class="status-indicator ${className}"></span>`;
        }

        // 加载系统概览
        async function loadSystemOverview() {
            try {
                const response = await fetch(`${API_BASE}/overview`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    document.getElementById('system-status').innerHTML = 
                        `${getStatusIndicator(data.data.status)} ${data.data.status}`;
                    document.getElementById('security-score').textContent = 
                        `${data.data.securityScore}/100`;
                    document.getElementById('security-progress').style.width = 
                        `${data.data.securityScore}%`;
                    document.getElementById('threat-level').textContent = data.data.threatLevel;
                    document.getElementById('active-layers').textContent = 
                        `${data.data.activeLayers}/${data.data.totalLayers}`;
                    
                    addLog(`系统概览更新: ${data.data.status} (评分: ${data.data.securityScore})`, 'success');
                } else {
                    addLog(`系统概览加载失败: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`系统概览连接失败: ${error.message}`, 'error');
            }
        }

        // 加载安全层状态
        async function loadSecurityLayers() {
            try {
                const response = await fetch(`${API_BASE}/layers/status`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    const layersContainer = document.getElementById('security-layers');
                    layersContainer.innerHTML = '';
                    
                    data.data.forEach(layer => {
                        const layerDiv = document.createElement('div');
                        layerDiv.className = 'metric';
                        layerDiv.innerHTML = `
                            <span>${layer.name}</span>
                            <span class="metric-value">
                                ${getStatusIndicator(layer.status)} ${layer.status} (${layer.health}%)
                            </span>
                        `;
                        layersContainer.appendChild(layerDiv);
                    });
                    
                    addLog(`安全层状态更新: ${data.data.length}个安全层`, 'success');
                } else {
                    addLog(`安全层状态加载失败: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`安全层状态连接失败: ${error.message}`, 'error');
            }
        }

        // 加载活跃威胁
        async function loadActiveThreats() {
            try {
                const response = await fetch(`${API_BASE}/threats/active`);
                const data = await response.json();
                
                if (data.success) {
                    const threatCount = data.data ? data.data.length : 0;
                    document.getElementById('threat-count').textContent = threatCount;
                    
                    const threatList = document.getElementById('threat-list');
                    threatList.innerHTML = '';
                    
                    if (threatCount > 0) {
                        data.data.slice(0, 3).forEach(threat => {
                            const threatDiv = document.createElement('div');
                            threatDiv.className = 'metric';
                            threatDiv.innerHTML = `
                                <span>${threat.type}</span>
                                <span class="metric-value">${threat.severity}</span>
                            `;
                            threatList.appendChild(threatDiv);
                        });
                        addLog(`发现 ${threatCount} 个活跃威胁`, 'warning');
                    } else {
                        const noThreatDiv = document.createElement('div');
                        noThreatDiv.className = 'metric';
                        noThreatDiv.innerHTML = `
                            <span>无活跃威胁</span>
                            <span class="metric-value">${getStatusIndicator('ACTIVE')} 安全</span>
                        `;
                        threatList.appendChild(noThreatDiv);
                        addLog('当前无活跃威胁', 'success');
                    }
                } else {
                    addLog(`活跃威胁加载失败: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`活跃威胁连接失败: ${error.message}`, 'error');
            }
        }

        // 加载性能指标
        async function loadPerformanceMetrics() {
            try {
                const response = await fetch(`${API_BASE}/metrics/performance`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    const cpu = data.data.system?.cpu || 0;
                    const memory = data.data.system?.memory || 0;
                    const tps = data.data.blockchain?.tps || 0;
                    
                    document.getElementById('cpu-usage').textContent = `${cpu}%`;
                    document.getElementById('cpu-progress').style.width = `${cpu}%`;
                    document.getElementById('memory-usage').textContent = `${memory}%`;
                    document.getElementById('memory-progress').style.width = `${memory}%`;
                    document.getElementById('blockchain-tps').textContent = tps;
                    
                    addLog(`性能指标更新: CPU ${cpu}%, 内存 ${memory}%, TPS ${tps}`, 'success');
                } else {
                    addLog(`性能指标加载失败: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`性能指标连接失败: ${error.message}`, 'error');
            }
        }

        // 刷新所有数据
        async function refreshAll() {
            addLog('开始刷新所有数据...', 'info');
            await Promise.all([
                loadSystemOverview(),
                loadSecurityLayers(),
                loadActiveThreats(),
                loadPerformanceMetrics()
            ]);
            addLog('所有数据刷新完成', 'success');
        }

        // 测试所有API
        async function testAllApis() {
            addLog('开始测试所有API接口...', 'info');
            
            const endpoints = [
                { name: '系统概览', url: '/overview' },
                { name: '安全层状态', url: '/layers/status' },
                { name: '活跃威胁', url: '/threats/active' },
                { name: '活跃决策', url: '/decisions/active' },
                { name: '性能指标', url: '/metrics/performance' },
                { name: '系统健康', url: '/health' }
            ];
            
            let passed = 0;
            let total = endpoints.length;
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${API_BASE}${endpoint.url}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        addLog(`✅ ${endpoint.name} API测试通过`, 'success');
                        passed++;
                    } else {
                        addLog(`❌ ${endpoint.name} API测试失败: ${data.error}`, 'error');
                    }
                } catch (error) {
                    addLog(`❌ ${endpoint.name} API连接失败: ${error.message}`, 'error');
                }
            }
            
            addLog(`API测试完成: ${passed}/${total} 通过 (${((passed/total)*100).toFixed(1)}%)`, 
                   passed === total ? 'success' : 'warning');
        }

        // 清空日志
        function clearLogs() {
            const logContainer = document.getElementById('log-container');
            logContainer.innerHTML = '';
            addLog('日志已清空', 'info');
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            addLog('安全控制台演示页面初始化完成', 'success');
            
            // 立即加载一次数据
            refreshAll();
            
            // 设置自动刷新（每30秒）
            refreshInterval = setInterval(refreshAll, 30000);
            addLog('已启用自动刷新 (30秒间隔)', 'info');
        });

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
